# P0 scope: containerize the HTTP server itself, nothing else. Postgres
# arrives in P1 (see plan.md) — this file gets a second service then.
services:
  gitcrackind:
    build: .
    ports:
      - "${GITCRACKIND_HOST_PORT:-8080}:8080"
    environment:
      GITCRACKIND_ADDR: ":8080"
    restart: unless-stopped
